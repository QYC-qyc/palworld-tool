# ============================================================
# 服务器直接拉取 Gitee 镜像仓库的 PalAdmin 镜像（不在服务器构建）
# 镜像：gitee.com/qyc-qyc/docker-palworld-tool:latest
#
# 用法：
#   1. cp .env.example .env && nano .env
#   2. docker login gitee.com
#   3. docker compose -f docker-compose.pull.yml up -d
#
# 说明：本文件为外置模式（原生 Linux 游戏服，不含 PalDefender）。
#       若要 PalDefender 集成模式，见 docker-compose.paldefender.yml。
# ============================================================
services:
  paladmin:
    image: gitee.com/qyc-qyc/docker-palworld-tool:latest
    container_name: paladmin
    restart: unless-stopped
    ports:
      - "8190:8190"
    volumes:
      - ./paladmin/config.yaml:/app/config.yaml
      - ./paladmin/data:/app/data
      - ./paladmin/backups:/app/backups
      - ./paladmin/evidence:/app/evidence
      - ./paladmin/logs:/app/logs
      # 游戏存档目录（回档需要读写，不能加 :ro）
      - /home/steam/Pal/Saved:/game/Saved
    environment:
      WEB__PASSWORD: "${WEB_PASSWORD:-ChangeMe!2024}"
      REST__ADDRESS: "http://palworld:8212"
      REST__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      RCON__ADDRESS: "palworld:25575"
      RCON__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      SAVE__PATH: "/game/Saved/SaveGames/0"
      SAVE__DECODE_PATH: "/app/sav_cli"
      ANTICHEAT__ENABLED: "true"
      ANTICHEAT__MODE: "external"
      PROCESS__MODE: "docker"
      PROCESS__CONTAINER: "palworld"
    networks:
      - palnet

networks:
  palnet:
    external: false
