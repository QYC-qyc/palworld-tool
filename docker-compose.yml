# ============================================================
# 镜像部署：PalAdmin（原生 Linux 游戏服 + 面板 + 反作弊）
# 所有数据统一放在 /www/palworld-tool/ 下
#
# 用法：
#   sudo mkdir -p /www/palworld-tool && cd /www/palworld-tool
#   sudo curl -o docker-compose.yml \
#     https://raw.githubusercontent.com/QYC-qyc/palworld-tool/main/docker-compose.yml
#   cat > .env <<'EOF'
#   WEB_PASSWORD=你的面板密码
#   GAME_ADMIN_PASSWORD=游戏AdminPassword
#   EOF
#   sudo docker compose up -d
#
# 首次访问 http://服务器IP:8190 会进入初始化向导设置密码。
# ============================================================
services:
  # ---------- 游戏服（原生 Linux 官方镜像）----------
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: "Asia/Shanghai"
      ALWAYS_UPDATE_ON_START: "true"
      MULTITHREAD_ENABLED: "true"
      SERVER_NAME: "My PalWorld Server"
      MAX_PLAYERS: "32"
      REST_API_ENABLED: "true"
      REST_API_PORT: "8212"
      RCON_ENABLED: "true"
      RCON_PORT: "25575"
      ADMIN_PASSWORD: "${GAME_ADMIN_PASSWORD:-ChangeMe_GameAdminPassword}"
      COMMUNITY_SERVER: "false"
    ports:
      - "8211:8211/udp"
      - "25575:25575/tcp"
      - "8212:8212/tcp"
    volumes:
      - /www/palworld-tool/game:/palworld
    networks:
      - palnet

  # ---------- PalAdmin 面板 ----------
  paladmin:
    image: ghcr.io/qyc-qyc/palworld-tool:latest
    container_name: paladmin
    restart: unless-stopped
    depends_on:
      - palworld
    ports:
      - "8190:8190"
    volumes:
      # 数据库与反作弊数据（named volume，不会遮蔽镜像内程序）
      - pst-data:/app/data
      - /www/palworld-tool/backups:/app/backups
      - /www/palworld-tool/evidence:/app/evidence
      - /www/palworld-tool/logs:/app/logs
      # 读取游戏存档（与游戏服共享 ./game）
      - /www/palworld-tool/game/Pal/Saved:/game/Saved
    environment:
      # 首次启动时用于初始化面板密码；初始化后以面板设置为准
      WEB__PASSWORD: "${WEB_PASSWORD:-}"
      STORAGE__PATH: "/app/data/pst.db"
      REST__ADDRESS: "http://palworld:8212"
      REST__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      RCON__ADDRESS: "palworld:25575"
      RCON__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      SAVE__PATH: "/game/Saved/SaveGames/0"
      SAVE__DECODE_PATH: "/app/sav_cli"
      ANTICHEAT__ENABLED: "true"
      ANTICHEAT__MODE: "external"
      PROCESS__MODE: "docker"
      PROCESS__CONTAINER: "palworld"
    networks:
      - palnet

volumes:
  pst-data:

networks:
  palnet:
    driver: bridge
