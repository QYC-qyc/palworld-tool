# PalWorld Panel + PalServer (Proton + PalDefender) Docker Compose 编排
#
# 快速开始：
#   1. 首次使用：docker compose build && docker compose up -d
#   2. 或使用预构建镜像（默认从阿里云 ACR 拉取，国内高速）：docker compose pull && docker compose up -d
#   3. 访问面板：http://服务器IP:8190
#
# 数据持久化：
#   ./data/gameserver  游戏服安装目录、存档、配置、PalDefender
#   ./data/palworld-panel    面板数据库、备份
#
# 可通过 .env 覆盖：
#   REGISTRY=crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal
#   TAG=latest
#   REST_PASSWORD=你的密码

services:
  # 游戏服：SteamCMD + GE-Proton + PalServer + PalDefender
  gameserver:
    build:
      context: .
      dockerfile: docker/gameserver/Dockerfile
    image: ${REGISTRY:-crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal}/palworld-gameserver:${TAG:-v3.0.2}
    container_name: palworld-gameserver
    restart: unless-stopped
    ports:
      - "8211:8211/udp"   # 游戏端口
      - "8212:8212/tcp"   # REST API
    volumes:
      - ./data/gameserver:/home/steam/palserver
    environment:
      - STEAMAPPID=2394010
      - PROTON_VERSION=9-22
      # 官方 REST API 密码（用户名固定 admin，面板用它连接）
      - REST_PASSWORD=${REST_PASSWORD:-paladmin}
    networks:
      - palnet

  # 面板：Go + Vue，通过 Docker API 管控游戏服容器
  palworld-panel:
    build:
      context: .
      dockerfile: docker/palworld-panel/Dockerfile
      args:
        VERSION: dev
    image: ${REGISTRY:-crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal}/palworld-panel:${TAG:-v3.0.2}
    container_name: palworld-panel
    restart: unless-stopped
    depends_on:
      - gameserver
    ports:
      - "8190:8190/tcp"   # 面板 Web
    volumes:
      - ./data/palworld-panel:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro  # 管控游戏服容器
    environment:
      - GAMESERVER_CONTAINER=palworld-gameserver
      - GAMESERVER_URL=http://gameserver:8212   # 面板连接游戏服 REST
      # REST 密码须与 gameserver 的 REST_PASSWORD 一致
      - REST_PASSWORD=${REST_PASSWORD:-paladmin}
    networks:
      - palnet

networks:
  palnet:
    driver: bridge
