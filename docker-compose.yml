# PalAdmin + PalServer (Proton + PalDefender) Docker Compose 编排
#
# 快速开始：
#   1. 首次使用：docker compose build && docker compose up -d
#   2. 或使用预构建镜像（设 GHCR_OWNER 后 docker compose pull && docker compose up -d）
#   3. 访问面板：http://服务器IP:8190
#
# 数据持久化：
#   ./data/gameserver  游戏服安装目录、存档、配置、PalDefender
#   ./data/paladmin    面板数据库、配置

services:
  # 游戏服：SteamCMD + GE-Proton + PalServer + PalDefender
  gameserver:
    build:
      context: .
      dockerfile: docker/gameserver/Dockerfile
    image: ${GHCR_OWNER:+ghcr.io/${GHCR_OWNER}/}palworld-gameserver:latest
    container_name: palworld-gameserver
    restart: unless-stopped
    ports:
      - "8211:8211/udp"   # 游戏端口
      - "8212:8212/tcp"   # REST API
    volumes:
      - ./data/gameserver:/home/steam/palserver
    environment:
      - STEAMAPPID=2394010
      - PROTON_VERSION=9-22
    networks:
      - palnet

  # 面板：Go + Vue，通过 Docker API 管控游戏服容器
  paladmin:
    build:
      context: .
      dockerfile: docker/paladmin/Dockerfile
      args:
        VERSION: dev
    image: ${GHCR_OWNER:+ghcr.io/${GHCR_OWNER}/}paladmin:latest
    container_name: paladmin
    restart: unless-stopped
    depends_on:
      - gameserver
    ports:
      - "8190:8190/tcp"   # 面板 Web
    volumes:
      - ./data/paladmin:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro  # 管控游戏服容器
    environment:
      - GAMESERVER_CONTAINER=palworld-gameserver
      - GAMESERVER_URL=http://gameserver:8212   # 面板连接游戏服 REST
    networks:
      - palnet

networks:
  palnet:
    driver: bridge
