# PalWorld Panel + PalServer (Proton + PalDefender) Docker Compose 编排
#
# 快速开始：
#   1. 首次使用：docker compose build && docker compose up -d
#   2. 或使用预构建镜像（默认从阿里云 ACR 拉取，国内高速）：docker compose pull && docker compose up -d
#   3. 访问面板：http://服务器IP:8190
#
# 数据持久化：
#   ./data/gameserver  游戏服安装目录、存档、配置、PalDefender
#   ./data/palworld-panel    面板数据库、备份
#
# 可通过 .env 覆盖：
#   REGISTRY=crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal
#   TAG=latest
#   REST_PASSWORD=你的密码

services:
  # 游戏服：SteamCMD + GE-Proton + PalServer + PalDefender
  palworld-gameserver:
    build:
      context: .
      dockerfile: docker/gameserver/Dockerfile
    image: ${REGISTRY:-crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal}/palworld-gameserver:${TAG:-latest}
    container_name: palworld-gameserver
    restart: unless-stopped
    ports:
      - "8211:8211/udp"   # 游戏端口
      - "8212:8212/tcp"   # REST API
    volumes:
      # 游戏安装目录（存档、配置、PalDefender）
      - ${GAMESERVER_DIR:-./data/gameserver}:/home/steam/palserver
      # SteamCMD 持久化（自更新成功一次后保留，重启不重新联网）
      - ${STEAMCMD_DIR:-./data/steamcmd}:/opt/steamcmd
      # Proton prefix 持久化（Wine 运行时数据）
      - ./data/prefix:/home/steam/prefix
    environment:
      - STEAMAPPID=2394010
      - PROTON_VERSION=9-22
      # 官方 REST API 密码（用户名固定 admin，面板用它连接）
      - REST_PASSWORD=${REST_PASSWORD:-paladmin}
    networks:
      - palnet

  # 面板：Go + Vue，通过 Docker API 管控游戏服容器
  palworld-panel:
    build:
      context: .
      dockerfile: docker/palworld-panel/Dockerfile
      args:
        VERSION: dev
    image: ${REGISTRY:-crpi-pwq7gsi7qm6vv08p.cn-chengdu.personal.cr.aliyuncs.com/qyc_pal}/palworld-panel:${TAG:-latest}
    container_name: palworld-panel
    restart: unless-stopped
    depends_on:
      - palworld-gameserver
    ports:
      - "8190:8190/tcp"   # 面板 Web
    volumes:
      - ./data/palworld-panel:/data
      - /var/run/docker.sock:/var/run/docker.sock  # 面板管控/自更新需要读写
      # 部署目录（含 docker-compose.yml），面板自更新时在此执行 compose pull/up。
      # 宿主机路径可用 COMPOSE_DIR 覆盖，默认是当前目录。
      - ${COMPOSE_DIR:-./}:/compose
      # 共享游戏目录、SteamCMD 目录、prefix：面板直接读写宿主机文件
      - ${GAMESERVER_DIR:-./data/gameserver}:/home/steam/palserver
      - ${STEAMCMD_DIR:-./data/steamcmd}:/opt/steamcmd
      - ./data/prefix:/home/steam/prefix
    environment:
      - GAMESERVER_CONTAINER=palworld-gameserver
      - GAMESERVER_URL=http://palworld-gameserver:8212   # 面板连接游戏服 REST
      # REST 密码须与 gameserver 的 REST_PASSWORD 一致
      - REST_PASSWORD=${REST_PASSWORD:-paladmin}
      # compose 项目目录（容器内路径），面板自更新用
      - COMPOSE_PROJECT_DIR=/compose
      # 游戏目录已挂载到面板容器同路径，直接用文件系统访问
      - GAMESERVER_GAME_DIR=/home/steam/palserver
    networks:
      - palnet

networks:
  palnet:
    driver: bridge
