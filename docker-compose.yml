services:
  paladmin:
    build: .
    image: paladmin:latest
    container_name: paladmin
    restart: unless-stopped
    ports:
      - "8190:8190"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - pst-data:/app/data
      - ./backups:/app/backups
      - ./evidence:/app/evidence
      - ./logs:/app/logs
      # 游戏存档目录：按实际路径挂载。若游戏服也在容器，用共享卷。
      - /home/steam/Pal/Saved:/game/Saved:ro
      # 回档/进程控制：挂载 docker socket 以控制游戏容器（可选）
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WEB__PASSWORD: "${WEB_PASSWORD:-ChangeMe!2024}"
      REST__ADDRESS: "http://palworld:8212"
      REST__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      RCON__ADDRESS: "palworld:25575"
      RCON__PASSWORD: "${GAME_ADMIN_PASSWORD:-}"
      SAVE__PATH: "/game/Saved"
      ANTICHEAT__ENABLED: "true"
      ANTICHEAT__MODE: "external"
      # 若安装了 PalDefender（Wine/Proton 游戏服），改为 integrated 并配置：
      # ANTICHEAT__MODE: "integrated"
      # PALDEFENDER__ENABLED: "true"
      # PALDEFENDER__ADDRESS: "http://palworld:17993"
      # PALDEFENDER__TOKEN: "${PALDEFENDER_TOKEN:-}"
      PROCESS__MODE: "docker"
      PROCESS__CONTAINER: "palworld"
    networks:
      - palnet

volumes:
  pst-data:

networks:
  palnet:
    external: false
