# ============================================================
# 镜像部署：PalAdmin 面板
# 面板通过宿主机上的 SteamCMD 安装/更新游戏服，并管理游戏进程。
# 因此需要把 SteamCMD 与游戏安装目录挂载进容器。
#
# 用法：
#   sudo mkdir -p /www/palworld-tool && cd /www/palworld-tool
#   sudo curl -o docker-compose.yml \
#     https://gitee.com/QYC-qyc/palworld-tool/raw/main/docker-compose.yml
#   sudo docker compose up -d
#   浏览器访问 http://服务器IP:8190
# ============================================================
services:
  paladmin:
    image: ghcr.io/qyc-qyc/palworld-tool:latest
    container_name: paladmin
    restart: unless-stopped
    network_mode: host
    volumes:
      # 数据库与反作弊数据（named volume）
      - pst-data:/app/data
      - /www/palworld-tool/backups:/app/backups
      - /www/palworld-tool/evidence:/app/evidence
      - /www/palworld-tool/logs:/app/logs
      # 挂载宿主机 SteamCMD 目录（面板据此执行安装/更新）
      - /home/steam/steamcmd:/opt/steamcmd
      # 挂载游戏安装目录（面板读取存档、启停服务端）
      - /home/steam/PalServer:/opt/palserver
    environment:
      TZ: "Asia/Shanghai"
      STORAGE__PATH: "/app/data/pst.db"
      SAVE__DECODE_PATH: "/app/sav_cli"
      # 容器内对应的路径（与上面挂载一致，填写目录即可）
      GAMESRV__STEAMCMD_PATH: "/opt/steamcmd"
      GAMESRV__INSTALL_DIR: "/opt/palserver"
      ANTICHEAT__ENABLED: "true"
      ANTICHEAT__MODE: "external"

volumes:
  pst-data:
