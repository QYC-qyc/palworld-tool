name: Release

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 在 Linux 上构建前端和 Go Windows exe（Go 可交叉编译）
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Windows paladmin.exe
        run: |
          set -e
          mkdir -p dist
          # 把前端 1.2 万个小文件压缩成单个 web.dat，避免用户解压缓慢
          pushd web/dist
          zip -qr -9 "${GITHUB_WORKSPACE}/web.dat" .
          popd
          cp web.dat dist/
          cp -r data dist/
          cp deploy/启动面板.bat dist/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin.exe .
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paladmin-build
          path: dist/

  # 在 Windows 上构建 sav_cli.exe（PyInstaller 不能交叉编译）
  build-savcli:
    if: github.event_name != 'delete'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sav_cli.exe
        run: |
          pip install -r module/requirements.txt pyinstaller
          pyinstaller --onefile --name sav_cli module/sav_cli.py

      - name: Upload sav_cli.exe
        uses: actions/upload-artifact@v4
        with:
          name: savcli-build
          path: dist/sav_cli.exe

  # 合并并发布
  release:
    if: github.event_name != 'delete'
    needs: [build, build-savcli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package zip
        run: |
          mkdir -p pkg
          cp release/paladmin-build/paladmin.exe pkg/
          cp release/paladmin-build/web.dat pkg/
          cp -r release/paladmin-build/data pkg/
          cp release/paladmin-build/启动面板.bat pkg/
          cp release/savcli-build/sav_cli.exe pkg/ 2>/dev/null || echo "sav_cli.exe 未生成（存档解析功能将不可用）"
          echo "=== 包内文件 ==="
          ls -lh pkg/
          echo "文件数: $(find pkg -type f | wc -l)"
          cd pkg
          zip -rq ../paladmin_windows_amd64.zip .
          cd ..
          ls -lh paladmin_windows_amd64.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Release $TAG (Windows)" \
            || echo "release $TAG 已存在，继续上传"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" paladmin_windows_amd64.zip --clobber; then
              echo "上传成功"
              break
            fi
            echo "上传失败，第 $attempt 次重试..."
            sleep $((attempt * 5))
          done

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release for deleted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 仍存在（可能重新推送），跳过删除 release"
            exit 0
          fi
          rid=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$rid" ] && [ "$rid" != "null" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rid}"
            echo "已删除 tag ${TAG} 对应的 release (id=${rid})"
          else
            echo "tag ${TAG} 没有对应的 release，无需删除"
          fi
