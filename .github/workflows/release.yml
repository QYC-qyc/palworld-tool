name: Release

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 仅在推送 tag 或手动触发时构建
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build sav_cli
        run: |
          pip3 install -r module/requirements.txt pyinstaller
          pyinstaller --onefile --name sav_cli module/sav_cli.py

      - name: Build Windows binary & package zip
        run: |
          mkdir -p dist
          cp -r web/dist dist/web
          cp dist/sav_cli dist/ 2>/dev/null || true
          cp -r data dist/
          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin.exe .
          cd dist
          zip -rq ../paladmin_windows_amd64.zip paladmin.exe web data sav_cli
          cd ..

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Release $TAG (Windows)" \
            || echo "release $TAG 已存在，继续上传"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" paladmin_windows_amd64.zip --clobber; then
              echo "上传成功"
              break
            fi
            echo "上传失败，第 $attempt 次重试..."
            sleep $((attempt * 5))
          done

  cleanup:
    # 删除 tag 时，同步删除对应的 GitHub Release
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release for deleted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 仍存在（可能重新推送），跳过删除 release"
            exit 0
          fi
          rid=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$rid" ] && [ "$rid" != "null" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rid}"
            echo "已删除 tag ${TAG} 对应的 release (id=${rid})"
          else
            echo "tag ${TAG} 没有对应的 release，无需删除"
          fi
