name: Release

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 构建 paladmin 二进制（Linux amd64/arm64）并上传 Release
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build sav_cli
        run: |
          pip3 install -r module/requirements.txt pyinstaller
          pyinstaller --onefile --name sav_cli module/sav_cli.py

      - name: Build binaries
        run: |
          mkdir -p dist
          cp -r web/dist dist/web
          cp dist/sav_cli dist/ 2>/dev/null || true
          cp -r data dist/
          cp deploy/paladmin.service dist/
          # amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin .
          tar -czf paladmin_linux_amd64.tar.gz -C dist paladmin web data sav_cli paladmin.service
          # arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin .
          tar -czf paladmin_linux_arm64.tar.gz -C dist paladmin web data sav_cli paladmin.service

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG (Docker + Proton)" \
            || echo "release 已存在"
          for f in paladmin_linux_amd64.tar.gz paladmin_linux_arm64.tar.gz; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$TAG" "$f" --clobber && break
              echo "重试 $f..."; sleep $((attempt * 5))
            done
          done

  # 构建并推送 gameserver Docker 镜像
  build-gameserver-image:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gameserver image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/palworld-gameserver:latest \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/palworld-gameserver:${{ github.ref_name }} \
            -f docker/gameserver/Dockerfile .
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/palworld-gameserver:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/palworld-gameserver:${{ github.ref_name }}

  # 构建并推送 paladmin Docker 镜像
  build-paladmin-image:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push paladmin image
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/paladmin:latest \
            -t ghcr.io/${{ steps.owner.outputs.owner }}/paladmin:${{ github.ref_name }} \
            -f docker/paladmin/Dockerfile .
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/paladmin:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/paladmin:${{ github.ref_name }}

  # 将 GHCR 镜像设为公开（package 默认私有，否则用户 pull 会 401）
  make-packages-public:
    if: github.event_name != 'delete'
    needs: [build-gameserver-image, build-paladmin-image]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for pkg in paladmin palworld-gameserver; do
            # 查询 package id 并设为 public
            pid=$(gh api "user/packages/container/$pkg" --jq '.id' 2>/dev/null)
            if [ -n "$pid" ] && [ "$pid" != "null" ]; then
              gh api -X PATCH "user/packages/container/$pkg" \
                -f visibility=public --silent && echo "$pkg 已设为公开" || echo "$pkg 设置失败"
            else
              # 可能在组织下，尝试 org 级别
              pid=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER,,}/packages/container/$pkg" --jq '.id' 2>/dev/null)
              if [ -n "$pid" ] && [ "$pid" != "null" ]; then
                gh api -X PATCH "orgs/${GITHUB_REPOSITORY_OWNER,,}/packages/container/$pkg" \
                  -f visibility=public --silent && echo "$pkg 已设为公开(org)"
              else
                echo "$pkg 未找到，跳过"
              fi
            fi
          done

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release for deleted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag 仍存在，跳过"; exit 0
          fi
          rid=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$rid" ] && [ "$rid" != "null" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rid}"
            echo "已删除 release $rid"
          fi
