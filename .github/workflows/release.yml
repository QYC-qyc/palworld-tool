      # 同步附件到 Gitee Release（国内加速）
      - name: Sync release assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 同步"
            exit 0
          fi

          API="https://gitee.com/api/v5/repos/QYC-qyc/palworld-tool/releases"
          AUTH="access_token=${GITEE_TOKEN}"

          echo "等待 Gitee 镜像同步 tag ${TAG} ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sS -o /tmp/gitee_rel.json -w "%{http_code}" "${API}/tags/${TAG}?${AUTH}")
            echo "  第 ${i} 次查询，状态码: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done

          if [ "$STATUS" = "200" ]; then
            echo "Gitee Release 已存在"
          else
            echo "创建 Gitee Release（状态码 $STATUS）..."
            curl -sS -X POST -o /tmp/gitee_create.json -w "创建状态码: %{http_code}\n" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"PalAdmin ${TAG}\",\"body\":\"自动构建版本\",\"target_commitish\":\"main\"}" \
              "${API}?${AUTH}"
            echo "创建返回内容:"
            cat /tmp/gitee_create.json; echo
            cp /tmp/gitee_create.json /tmp/gitee_rel.json
          fi

          echo "Release 原始返回:"
          cat /tmp/gitee_rel.json; echo
          REL_ID=$(jq -r '.id // empty' /tmp/gitee_rel.json)
          echo "解析出的 Release ID: [${REL_ID}]"

          if [ -z "$REL_ID" ]; then
            echo "::warning::未能获取 Gitee Release ID，跳过附件上传"
            exit 0
          fi

          for FILE in paladmin_linux_amd64.tar.gz paladmin_linux_arm64.tar.gz; do
            echo "上传 ${FILE} ..."
            curl -sS -o /tmp/gitee_up.json -w "上传状态码: %{http_code}\n" -X POST \
              -F "file=@${FILE}" \
              "${API}/${REL_ID}/attach_files?${AUTH}"
            echo "上传返回:"
            cat /tmp/gitee_up.json; echo
          done
          echo "Gitee 附件上传完成"
