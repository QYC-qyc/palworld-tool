name: Release

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 构建 palworld-panel 二进制（Linux amd64/arm64）并上传 Release
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build sav_cli
        run: |
          pip3 install -r module/requirements.txt pyinstaller
          pyinstaller --onefile --name sav_cli module/sav_cli.py

      - name: Build binaries
        run: |
          mkdir -p dist
          cp -r web/dist dist/web
          cp dist/sav_cli dist/ 2>/dev/null || true
          cp -r data dist/
          cp deploy/palworld-panel.service dist/
          # amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/palworld-panel .
          tar -czf palworld-panel_linux_amd64.tar.gz -C dist palworld-panel web data sav_cli palworld-panel.service
          # arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/palworld-panel .
          tar -czf palworld-panel_linux_arm64.tar.gz -C dist palworld-panel web data sav_cli palworld-panel.service

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG (Docker + Proton)" \
            || echo "release 已存在"
          for f in palworld-panel_linux_amd64.tar.gz palworld-panel_linux_arm64.tar.gz; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$TAG" "$f" --clobber && break
              echo "重试 $f..."; sleep $((attempt * 5))
            done
          done

  # 构建并推送 gameserver Docker 镜像（GHCR + 阿里云 ACR）
  build-gameserver-image:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: env.ALIYUN_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Build and push gameserver image
        run: |
          # 只推 latest 标签（GHCR + 配置了的阿里云 ACR）
          TAGS="ghcr.io/${{ steps.owner.outputs.owner }}/palworld-gameserver:latest"
          if [ -n "$ALIYUN_REGISTRY" ] && [ -n "$ALIYUN_NAMESPACE" ]; then
            TAGS="$TAGS $ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/palworld-gameserver:latest"
          fi
          BUILD_ARGS=""
          for t in $TAGS; do BUILD_ARGS="$BUILD_ARGS -t $t"; done
          # provenance=false 兼容阿里云 ACR（其不支持 OCI empty manifest）
          docker buildx build --push --provenance=false --sbom=false $BUILD_ARGS \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -f docker/gameserver/Dockerfile .

  # 构建并推送 palworld-panel Docker 镜像（GHCR + 阿里云 ACR）
  build-palworld-panel-image:
    if: github.event_name != 'delete'
    runs-on: ubuntu-22.04
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: env.ALIYUN_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Build and push palworld-panel image
        run: |
          # 只推 latest 标签（GHCR + 配置了的阿里云 ACR）
          TAGS="ghcr.io/${{ steps.owner.outputs.owner }}/palworld-panel:latest"
          if [ -n "$ALIYUN_REGISTRY" ] && [ -n "$ALIYUN_NAMESPACE" ]; then
            TAGS="$TAGS $ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/palworld-panel:latest"
          fi
          BUILD_ARGS=""
          for t in $TAGS; do BUILD_ARGS="$BUILD_ARGS -t $t"; done
          # provenance=false 兼容阿里云 ACR（其不支持 OCI empty manifest）
          docker buildx build --push --provenance=false --sbom=false $BUILD_ARGS \
            --build-arg VERSION=${{ github.ref_name }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -f docker/palworld-panel/Dockerfile .

  # 将 GHCR 镜像设为公开（package 默认私有，否则用户 pull 会 401）
  make-packages-public:
    if: github.event_name != 'delete'
    needs: [build-gameserver-image, build-palworld-panel-image]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # GITHUB_TOKEN 对 user/packages 的写权限可能受限，用 GraphQL + REST 双保险
          for pkg in palworld-panel palworld-gameserver; do
            # 优先用用户级别 API
            for path in "user/packages/container/$pkg" "orgs/$OWNER/packages/container/$pkg"; do
              code=$(gh api -X PATCH "$path" -f visibility=public --silent 2>&1; echo $?)
              if [ "$code" = "0" ]; then
                echo "$pkg 已设为公开 ($path)"
                break
              else
                echo "$pkg 在 $path 设置失败: $code"
              fi
            done
          done

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release for deleted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag 仍存在，跳过"; exit 0
          fi
          rid=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$rid" ] && [ "$rid" != "null" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rid}"
            echo "已删除 release $rid"
          fi
