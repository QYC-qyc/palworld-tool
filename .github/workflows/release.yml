name: Release

on:
  push:
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 仅在推送 tag 或手动触发时构建
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build sav_cli
        run: |
          pip3 install -r module/requirements.txt pyinstaller
          pyinstaller --onefile --name sav_cli module/sav_cli.py

      - name: Build binaries
        run: |
          mkdir -p dist
          cp -r web/dist dist/web
          cp dist/sav_cli dist/ 2>/dev/null || true
          cp -r data dist/
          cp deploy/paladmin.service dist/
          # amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin .
          tar -czf paladmin_linux_amd64.tar.gz -C dist paladmin web data sav_cli paladmin.service
          # arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/paladmin .
          tar -czf paladmin_linux_arm64.tar.gz -C dist paladmin web data sav_cli paladmin.service

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paladmin_linux_amd64.tar.gz
            paladmin_linux_arm64.tar.gz

  cleanup:
    # 删除 tag 时，同步删除对应的 GitHub Release
    if: github.event_name == 'delete' && github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Delete release for deleted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        run: |
          set +e
          rid=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$rid" ] && [ "$rid" != "null" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${rid}"
            echo "已删除 tag ${TAG} 对应的 release (id=${rid})"
          else
            echo "tag ${TAG} 没有对应的 release，无需删除"
          fi
