name: Build and Push Docker Image

# 推送到 main 后自动构建，并推送到 GHCR 和 Gitee 容器仓库
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "web/**"
      - "module/**"
      - "data/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker.yml"
  release:
    types: [published]
  workflow_dispatch: {}

env:
  GHCR_REGISTRY: ghcr.io
  GITEE_REGISTRY: gitee.com
  IMAGE_NAME: qyc-qyc/docker-palworld-tool

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（用内置 token）
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Gitee 容器仓库（需在 GitHub 仓库 Settings→Secrets 配置）
      - name: Log in to Gitee
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITEE_REGISTRY }}
          username: ${{ secrets.GITEE_USERNAME }}
          password: ${{ secrets.GITEE_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}
            ${{ env.GITEE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
